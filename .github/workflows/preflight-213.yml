name: RoomSuite 2.1.3 installer playback check

on:
  push:
    branches: ['codex/roomsuite-213-preflight']

permissions:
  contents: read
  actions: read

jobs:
  installer-playback:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --prefix mcp
      - name: Download the verified preflight installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41232326070 --repo $env:GITHUB_REPOSITORY --name RoomSuite-Windows --dir "$env:RUNNER_TEMP/roomsuite-artifact"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the preflight installer.' }
      - name: Verify bundled silent and audible MP4 playback
        shell: pwsh
        run: node windows/installer-smoke.cjs "$env:RUNNER_TEMP/roomsuite-artifact/RoomSuite-Setup.exe" "$env:RUNNER_TEMP/roomsuite-smoke"
