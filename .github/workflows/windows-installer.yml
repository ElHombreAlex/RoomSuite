name: RoomSuite installers

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install MCP build dependencies
        run: npm ci --prefix mcp
      - name: Test RoomSuite
        run: npm test
      - name: Install browser for Office and MCP tests
        run: node mcp/node_modules/playwright/cli.js install chromium --only-shell
      - name: Test the full MCP suite
        env:
          ROOMSUITE_MCP_TEST_MODELS: '1'
          ROOMSUITE_TEST_CLEANUP_MODEL: '1'
        run: npm --prefix mcp test
      - name: Build the installer
        shell: pwsh
        run: ./windows/build-installer.ps1
      - name: Test the installer and optional MCP component
        shell: pwsh
        run: node windows/installer-smoke.cjs dist/RoomSuite-Setup.exe "$env:RUNNER_TEMP/roomsuite-tests"
      - name: Record the installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/RoomSuite-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RoomSuite-Setup.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: RoomSuite-Windows
          path: |
            dist/RoomSuite-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install MCP dependencies
        run: npm ci --prefix mcp
      - name: Install Chromium
        run: node mcp/node_modules/playwright/cli.js install chromium --only-shell --with-deps
      - name: Keep test-server ports out of the client ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_port_range="45000 65535"
      - name: Test RoomSuite
        run: npm test
      - name: Test the full MCP suite
        run: npm --prefix mcp test
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install MCP build dependencies
        run: npm ci --prefix mcp
      - name: Test RoomSuite on macOS
        run: npm test
      - name: Install Chromium for browser tests
        run: node mcp/node_modules/playwright/cli.js install chromium --only-shell
      - name: Test creative and Office workflows
        run: node --test --test-concurrency=1 mcp/tests/office-ui.test.mjs mcp/tests/integration.test.mjs mcp/tests/mp4-export.test.mjs mcp/tests/color-look.test.mjs mcp/tests/motionroom.test.mjs mcp/tests/motionroom-321.test.mjs mcp/tests/motionroom-322.test.mjs
      - name: Build the Mac installer
        run: bash macos/build-installer.sh
      - name: Test the installed application and MCP
        run: bash macos/smoke-installer.sh "dist/RoomSuite-macOS-${{ matrix.arch }}.dmg"
      - name: Record the installer checksum
        run: cd dist && shasum -a 256 "RoomSuite-macOS-${{ matrix.arch }}.dmg" > "SHA256SUMS-macOS-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: RoomSuite-macOS-${{ matrix.arch }}
          path: |
            dist/RoomSuite-macOS-${{ matrix.arch }}.dmg
            dist/SHA256SUMS-macOS-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 90
