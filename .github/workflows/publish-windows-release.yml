name: Publish RoomSuite release

on:
  workflow_run:
    workflows: ['RoomSuite installers']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching the built package version'
        required: true
      build_run_id:
        description: 'Successful RoomSuite installers workflow run ID'
        required: true
      source_sha:
        description: 'Full commit SHA built by that workflow run'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_commit.message, 'Release RoomSuite v'))
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
      SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha }}
      AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
    steps:
      - name: Check out the built source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.workflow_run.head_sha }}
      - name: Verify the build and download its artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BUILD_RUN_ID -notmatch '^[0-9]+$' -or $env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid workflow run ID or source SHA.' }
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if (-not $env:RELEASE_TAG) { $env:RELEASE_TAG = "v$version" }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' -or $env:RELEASE_TAG -ne "v$version") { throw 'The release tag must match the built package version.' }
          if ($env:AUTOMATIC -eq 'true') {
            $message = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:SOURCE_SHA" --jq '.commit.message'
            if ($LASTEXITCODE -ne 0 -or $message -ne "Release RoomSuite $env:RELEASE_TAG") { throw 'An automatic release requires the exact matching release commit message.' }
          }
          "RELEASE_TAG=$env:RELEASE_TAG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the installer workflow run.' }
          $run = $runJson | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne $env:SOURCE_SHA -or $run.head_branch -ne 'main' -or $run.path -ne '.github/workflows/windows-installer.yml') { throw 'Installers must come from a successful main-branch RoomSuite installers run at the specified commit.' }
          $dir = Join-Path $env:RUNNER_TEMP 'roomsuite-release'
          $packages = @(
            @{ Artifact='RoomSuite-Windows'; File='RoomSuite-Setup.exe'; Sums='SHA256SUMS.txt' },
            @{ Artifact='RoomSuite-macOS-arm64'; File='RoomSuite-macOS-arm64.dmg'; Sums='SHA256SUMS-macOS-arm64.txt' },
            @{ Artifact='RoomSuite-macOS-x64'; File='RoomSuite-macOS-x64.dmg'; Sums='SHA256SUMS-macOS-x64.txt' }
          )
          $lines = @()
          foreach ($package in $packages) {
            $packageDir = Join-Path $dir $package.Artifact
            gh run download $env:BUILD_RUN_ID --repo $env:GITHUB_REPOSITORY --name $package.Artifact --dir $packageDir
            if ($LASTEXITCODE -ne 0) { throw "Could not download $($package.Artifact)." }
            $installer = Join-Path $packageDir $package.File
            $checksums = Join-Path $packageDir $package.Sums
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf) -or -not (Test-Path -LiteralPath $checksums -PathType Leaf)) { throw "Missing installer or checksum for $($package.Artifact)." }
            $checksumLines = @(Get-Content -LiteralPath $checksums)
            if ($checksumLines.Count -ne 1 -or $checksumLines[0] -notmatch '^([0-9a-fA-F]{64})\s+(.+)$' -or $Matches[2] -ne $package.File) { throw "Invalid checksum file for $($package.Artifact)." }
            $expected = $Matches[1].ToLowerInvariant()
            if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Checksum mismatch for $($package.File)." }
            Copy-Item -LiteralPath $installer -Destination (Join-Path $dir $package.File)
            $lines += "$expected  $($package.File)"
          }
          $lines | Set-Content -LiteralPath (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
      - name: Create the release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $refsJson = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing tags.' }
          $refs = @($refsJson | ConvertFrom-Json)
          if ($refs | Where-Object { $_.ref -eq "refs/tags/$env:RELEASE_TAG" }) { throw 'The release tag already exists; refusing to replace it.' }
          $dir = Join-Path $env:RUNNER_TEMP 'roomsuite-release'
          if (-not (Test-Path -LiteralPath 'RELEASE_NOTES.md')) { throw 'Release notes are missing from the built source.' }
          gh release create $env:RELEASE_TAG (Join-Path $dir 'RoomSuite-Setup.exe') (Join-Path $dir 'RoomSuite-macOS-arm64.dmg') (Join-Path $dir 'RoomSuite-macOS-x64.dmg') (Join-Path $dir 'SHA256SUMS.txt') --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --title "RoomSuite $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release; inspect GitHub for a draft before retrying.' }
