<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f8f6"><title>NotesRoom — RoomSuite</title><link rel="stylesheet" href="/suite/common.css"><link rel="stylesheet" href="/suite/shared.css"><link rel="stylesheet" href="style.css"><script defer src="/suite/shared.js"></script><script defer src="app.js"></script></head>
<body><header class="topbar"><a class="logo" href="/"><span class="logo-mark">✳</span><span>room<span class="dot">suite</span></span></a><span class="top-divider"></span><span class="top-title">NotesRoom / Notes</span><div class="top-actions"><a class="btn" href="/files/" target="_blank" rel="noopener">Shared files ↗</a><button id="newNote" class="btn accent">＋ New note</button></div></header>
<div class="notes-layout"><aside class="notes-sidebar"><div class="eyebrow">YOUR IDEAS, TOGETHER</div><h1>NotesRoom<span class="dot">.</span></h1><p class="hint">A quiet place for ideas, plans and project notes.</p><label class="field"><span>Search notes</span><input id="search" type="search" placeholder="Title, text or tag"></label><label class="field"><span>Folder</span><select id="folderFilter"><option value="*">All notes</option><option value="">Unfiled</option></select></label><div class="row"><button class="btn small" id="newFolder">＋ Folder</button><button class="btn small danger" id="deleteFolder">Delete folder</button></div><p class="hint" id="sidebarStatus" role="status" aria-live="polite"></p><div class="notes-list" id="notesList"></div><button class="btn block" id="importShared">Open Markdown from shared files</button></aside>
<main class="notes-main"><div id="empty" class="notes-empty"><div class="empty-icon">✎</div><h2>A little space to think<span class="dot">.</span></h2><p>Pick a note or start a fresh one.</p><button class="btn accent" id="emptyNew">＋ New note</button></div><div id="editor" class="hidden"><div class="notes-heading"><div><div class="eyebrow">YOUR NOTE</div><input id="title" aria-label="Note title" maxlength="160" placeholder="Untitled note"></div><div class="notes-actions"><button class="btn small" id="copyLink">Copy link</button><button class="btn small" id="saveShared">Save Markdown to shared files</button><button class="btn small danger" id="deleteNote">Delete</button></div></div><div class="note-meta"><label class="field"><span>Folder</span><select id="noteFolder"></select></label><label class="field"><span>Tags, separated by commas</span><input id="tags" placeholder="ideas, project"></label></div><div class="editor-toolbar"><span>MARKDOWN</span><div><button class="btn small" id="writeTab">Write</button><button class="btn small" id="previewTab">Preview</button></div></div><textarea id="body" aria-label="Markdown note" spellcheck="true" placeholder="Start writing…"></textarea><article id="preview" class="markdown hidden"></article><div class="save-line"><span id="saveStatus" role="status" aria-live="polite">Saved</span><button class="btn small hidden" id="saveCopy">Save as a copy</button><button class="btn small hidden" id="reload">Reload latest</button></div></div></main></div></body></html>
