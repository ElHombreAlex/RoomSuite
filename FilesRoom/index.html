<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f8f6"><title>Shared files — RoomSuite</title><link rel="stylesheet" href="/suite/common.css"><link rel="stylesheet" href="style.css"><script defer src="/suite/shared.js"></script><script defer src="app.js"></script></head>
<body><header class="topbar"><a class="logo" href="/"><span class="logo-mark">✳</span><span>room<span class="dot">suite</span></span></a><span class="top-divider"></span><span class="top-title">Shared files</span><div class="top-actions"><a class="btn" href="/" >All rooms</a></div></header>
<main class="files-home"><div class="files-heading"><div><div class="eyebrow">YOUR SHARED SPACE</div><h1>Files for every room<span class="dot">.</span></h1><p>Keep files together and open them from your authorized devices.</p></div><div class="files-actions"><button class="btn" id="newFolder">＋ New folder</button><label class="btn accent upload-label" for="upload">↑ Upload files</label><input id="upload" type="file" multiple hidden></div></div>
<div class="storage card"><span>Shared storage</span><strong id="usage">Checking…</strong><div class="storage-bar"><span id="usageBar"></span></div></div>
<section class="files-card card"><div class="files-nav"><div><div class="eyebrow">BROWSE YOUR FILES</div><h2 id="currentFolder">Shared files</h2></div><button class="btn small" id="up">← Parent folder</button></div><label class="search-label" for="search">Search all shared files</label><input id="search" class="file-search" type="search" maxlength="200" placeholder="Search by name or path"><div id="status" class="status" role="status" aria-live="polite"></div><div class="files-list" id="list"></div></section><p class="hint">Files are stored on this server. Download or back up anything you want to keep.</p></main></body></html>
